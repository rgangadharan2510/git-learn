apiVersion: apps/v1
kind: Deployment
metadata:
  name: rg-python-refresh
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rg-python-refresh
  template:
    metadata:
      labels:
        app: rg-python-refresh
    spec:
      containers:
        - name: rg-python-refresh
          image: 523140806637.dkr.ecr.us-east-1.amazonaws.com/rg-python-refresh:latest
          imagePullPolicy: Always
          args: ["--download"]
          env:
            - name: S3_BUCKET
              value: "rg-python-refresh"
